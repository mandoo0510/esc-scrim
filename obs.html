<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ESC SCRIM · OBS Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root{
  --a:.55; --panel:rgba(12,13,16,var(--a)); --row:rgba(18,20,25,var(--a)); --row2:rgba(12,13,17,var(--a)); --line:rgba(255,255,255,.06);
  --text:#F1EEE6; --muted:#9A9EA6; --y:#F2A900; --yink:#141006; --up:#7FD66B; --down:#FF6B5E;
  --silver:#C9CDD3; --bronze:#C98A4E;
  --disp:"Barlow Condensed","Noto Sans KR",system-ui,sans-serif;
  --nw:120px;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--text);font-family:"Noto Sans KR",system-ui,sans-serif;overflow:hidden}
body.preview{background:repeating-conic-gradient(#2a2d33 0 25%,#1f2226 0 50%) 0 0/24px 24px}
.ov{width:max-content;transform-origin:top left}
.head{display:flex;align-items:stretch;clip-path:polygon(0 0,100% 0,100% 100%,12px 100%,0 calc(100% - 12px))}
.tag{flex:none;background:rgba(6,7,9,calc(var(--a) + .3));display:flex;align-items:center;padding:4px 8px 4px 6px;border-bottom:2px solid var(--y)}
.tag img{height:66px;width:auto;display:block}
.tag span{display:none}
.tag.txt{background:var(--y);color:var(--yink);font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.05em;text-transform:uppercase;padding:9px 14px 7px;border:0}
.tag.txt span{display:block}
.mt{flex:1;background:rgba(6,7,9,calc(var(--a) + .2));display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:6px 12px;min-width:0;border-bottom:2px solid var(--y)}
.mt b{font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.06em;line-height:1;text-transform:uppercase;white-space:nowrap}
.mt small{font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:2px;white-space:nowrap}
.cols,.row{display:grid;grid-template-columns:38px 30px 30px minmax(var(--nw),1fr) 44px 48px;align-items:center}
.cols{background:rgba(6,7,9,calc(var(--a) + .15));font-family:var(--disp);font-weight:600;font-size:11px;letter-spacing:.12em;color:var(--muted);padding:6px 0 5px;text-transform:uppercase}
.cols span{text-align:center}.cols .h{grid-column:1/3}.cols .t{text-align:left;grid-column:3/5;padding-left:6px}
.list{background:transparent}
.row{height:36px;background:var(--row);border-top:1px solid var(--line);transition:background .3s}
.row:nth-child(even){background:var(--row2)}
.rk{align-self:stretch;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:21px;background:rgba(0,0,0,.25)}
.r1 .rk{background:var(--y);color:var(--yink)}.r2 .rk{background:var(--silver);color:#14161a}.r3 .rk{background:var(--bronze);color:#1b1107}
.lg{width:24px;height:24px;margin-left:4px;display:grid;place-items:center;overflow:hidden;background:#0B0C0E;border:1px solid rgba(255,255,255,.1);font-family:var(--disp);font-weight:800;font-size:13px;color:var(--muted)}
.lg img{width:100%;height:100%;object-fit:contain}
.nm{display:flex;align-items:center;gap:6px;padding:0 4px 0 8px;min-width:0}
.nm b{font-family:var(--disp);font-weight:700;font-size:18px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg{align-self:stretch;display:flex;align-items:center;justify-content:center;gap:1px;font-family:var(--disp);font-weight:700;font-size:14px;line-height:1;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.18)}
.chg i{font-style:normal;font-size:9px}
.chg.up{color:var(--up)}.chg.down{color:var(--down)}.chg.same{color:rgba(255,255,255,.28)}
.pts{text-align:center;font-family:var(--disp);font-weight:800;font-size:21px;font-variant-numeric:tabular-nums}
.r1 .pts{color:var(--y)}
.k{text-align:center;font-family:var(--disp);font-weight:600;font-size:18px;color:#C9CBD0;font-variant-numeric:tabular-nums}
.foot{height:4px;background:var(--y);clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.flash{animation:fl .9s ease}
@keyframes fl{0%{background:rgba(242,169,0,.35)}100%{}}
.msg{background:var(--panel);padding:18px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="ov" id="ov">
  <div class="head"><div class="tag" id="tag"><img src="assets/logo-sm.png" alt="ESC SCRIM" onerror="this.parentNode.classList.add('txt');this.remove()"><span id="tagT">ESC SCRIM</span></div><div class="mt"><b id="mt">OVERALL</b><small id="ms">&nbsp;</small></div></div>
  <div class="cols"><span class="h">#</span><span class="t">Team</span><span>Pts</span><span>Kills</span></div>
  <div class="list" id="list"><div class="msg">불러오는 중…</div></div>
  <div class="foot"></div>
</div>
<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycbzJpd737Mo8J2tegE1xXX_sYjp7AiezjTcb7Qf2ggbSKvtYv_amYUSsMRFnL-NjDwmkeQ/exec';
  var DEFAULT_ID = '1aNuWrDacxbF6_IkwmxXzc-y88YSGJ_20zs6xprR4eVo';
  var q = new URLSearchParams(location.search);
  var ID = q.get('id') || DEFAULT_ID;
  var FIX = q.get('match') ? Math.max(1, parseInt(q.get('match'), 10)) - 1 : null;
  var ONLY = q.get('mode') === 'one';
  var TOP = q.get('top') ? Math.max(1, parseInt(q.get('top'), 10)) : 0;
  var SCALE = q.get('scale') ? parseFloat(q.get('scale')) : 1;
  var TITLE = q.get('title') || '';
  if (q.get('preview') === '1') document.body.className = 'preview';
  if (SCALE && SCALE !== 1) document.getElementById('ov').style.transform = 'scale(' + SCALE + ')';
  if (q.get('bg') != null) { var a = parseFloat(q.get('bg')); if (a >= 0 && a <= 1) document.documentElement.style.setProperty('--a', String(a)); }

  var D = null, logos = {}, asked = {}, lastPos = {}, lastSig = '';
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function api(p){ p._ = Date.now(); return fetch(API + '?' + new URLSearchParams(p), { credentials: 'omit', cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){ if (j && j.error) throw new Error(j.error); return j; }); }
  function played(m){ return D.res[m] && D.res[m].some(function(x){ return x.r; }); }
  function latest(){ for (var m = D.matches - 1; m >= 0; m--) if (played(m)) return m; return -1; }
  function standings(M, only){
    var rows = D.teams.map(function(t, i){
      var pts = 0, kills = 0, wins = 0;
      for (var m = 0; m < D.matches; m++){ if (M < 0 || m > M || (only && m !== M)) continue; var x = D.res[m][i]; if (x){ pts += x.p; kills += x.k; if (x.r === 1) wins++; } }
      return { t: t, pts: Math.round(pts * 10) / 10, kills: kills, wins: wins };
    });
    rows.sort(function(a, b){ return b.pts - a.pts || b.kills - a.kills || b.wins - a.wins || a.t.n - b.t.n; });
    rows.forEach(function(r, k){ r.pos = k + 1; });
    return rows;
  }
  function logo(t){ return t.logo && logos[t.logo] ? '<span class="lg"><img src="' + logos[t.logo] + '" alt="" onerror="this.remove()"></span>' : '<span class="lg">' + esc(String(t.name).charAt(0).toUpperCase()) + '</span>'; }
  function render(){
    var L = latest(), M = FIX == null ? L : Math.min(FIX, D.matches - 1), only = ONLY && M >= 0;
    var map = String((D.maps && D.maps[M]) || '').replace(/[^A-Za-z0-9가-힣]+$/, '').trim();
    $('tagT').textContent = TITLE || D.title || 'SCRIM';
    $('mt').textContent = M < 0 ? 'READY' : (only ? 'MATCH ' + (M + 1) : (M + 1 >= D.matches ? 'OVERALL' : 'MATCH ' + (M + 1)));
    $('ms').textContent = M < 0 ? (D.teams.length + ' TEAMS') : (only ? (map || 'MATCH RESULT') : ('AFTER ' + (M + 1) + ' / ' + D.matches + (map ? ' · ' + map : '')));
    var rows = standings(M, only), prev = {};
    if (!only && M > 0) standings(M - 1, false).forEach(function(r){ prev[r.t.n] = r.pos; });
    if (TOP) rows = rows.slice(0, TOP);
    $('list').innerHTML = rows.map(function(r){
      var c = '<div class="chg"></div>';
      if (prev[r.t.n]) { var d = prev[r.t.n] - r.pos; c = d > 0 ? '<div class="chg up"><i>▲</i>' + d + '</div>' : d < 0 ? '<div class="chg down"><i>▼</i>' + (-d) + '</div>' : '<div class="chg same">–</div>'; }
      var moved = lastPos[r.t.n] && lastPos[r.t.n] !== r.pos;
      return '<div class="row r' + r.pos + (moved ? ' flash' : '') + '"><div class="rk">' + r.pos + '</div>' + c + logo(r.t) + '<div class="nm"><b>' + esc(r.t.name) + '</b></div><div class="pts">' + r.pts + '</div><div class="k">' + r.kills + '</div></div>';
    }).join('');
    var w = 0, ns = document.querySelectorAll('.nm');
    for (var j = 0; j < ns.length; j++){ var t = 14; for (var k = 0; k < ns[j].children.length; k++) t += ns[j].children[k].scrollWidth + 6; if (t > w) w = t; }
    document.documentElement.style.setProperty('--nw', Math.min(Math.max(w, 96), 240) + 'px');
    lastPos = {}; rows.forEach(function(r){ lastPos[r.t.n] = r.pos; });
  }
  function load(){
    api({ api: 'board', id: ID }).then(function(d){
      var sig = JSON.stringify([d.res, d.teams, d.title, d.maps]);
      D = d; if (sig !== lastSig){ lastSig = sig; render(); }
      var ids = d.teams.map(function(t){ return t.logo; }).filter(function(id){ return id && !asked[id]; });
      if (ids.length){ ids.forEach(function(id){ asked[id] = 1; }); api({ api: 'logos', ids: ids.join(',') }).then(function(o){ for (var k in o) if (o[k]) logos[k] = o[k]; render(); }).catch(function(){}); }
    }).catch(function(e){ if (!D) $('list').innerHTML = '<div class="msg">' + esc(e.message) + '</div>'; });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (D) render(); });
  load(); setInterval(load, 8000);
})();
</script>
</body>
</html>
